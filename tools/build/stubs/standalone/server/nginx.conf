# Smart License Server — nginx server block.
#
# 1. Replace /var/www/smart-license-server with the folder this release was
#    extracted to, and licenses.example.com with your domain.
# 2. Match fastcgi_pass to your PHP-FPM socket ({{PHP_REQUIREMENT}}).
# 3. Copy to /etc/nginx/sites-available/, enable it, then: nginx -t && systemctl reload nginx
#
# Only public/ is served. Everything else (system/, storage/, .env) stays
# outside the web root.

server {
    listen 80;
    listen [::]:80;
    server_name licenses.example.com;

    root /var/www/smart-license-server/public;
    index index.php;
    charset utf-8;

    # Largest upload accepted (plugin, theme and software packages).
    # Keep in line with PHP's upload_max_filesize and post_max_size.
    client_max_body_size 64m;

    # Hidden files (.htaccess, .env copies, VCS folders), except ACME challenges.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Static files when they exist (public/assets is a link the installer creates),
    # otherwise the application.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # index.php is the only PHP file that runs, including /index.php/<path>
    # URLs, which the web installer can use before rewrites are in place.
    location ~ ^/index\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:{{PHP_FPM_SOCKET}};
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ {
        return 404;
    }
}