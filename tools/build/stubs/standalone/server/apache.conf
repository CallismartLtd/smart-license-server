# Smart License Server — Apache virtual host.
#
# For your own server. On shared hosting you do not need this file: point the
# domain's document root at the public/ folder, and the installer writes
# public/.htaccess for you.
#
# 1. Replace /var/www/smart-license-server with the folder this release was
#    extracted to, and licenses.example.com with your domain.
# 2. Match the SetHandler line to your PHP-FPM socket ({{PHP_REQUIREMENT}}),
#    or remove it if PHP runs as an Apache module.
# 3. Needs mod_rewrite (and mod_proxy_fcgi for PHP-FPM):
#    a2enmod rewrite proxy_fcgi
#    Copy to /etc/apache2/sites-available/, a2ensite it, then: apachectl configtest && systemctl reload apache2
#
# Only public/ is served. Everything else (system/, storage/, .env) stays
# outside the web root.

<VirtualHost *:80>
    ServerName licenses.example.com
    DocumentRoot /var/www/smart-license-server/public

    <Directory /var/www/smart-license-server/public>
        # public/assets is a symbolic link the installer creates.
        Options -Indexes +FollowSymLinks
        # The rewrite rules live in public/.htaccess, written by the installer.
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:{{PHP_FPM_SOCKET}}|fcgi://localhost"
    </FilesMatch>

    # Largest upload accepted, in bytes (64 MB; plugin, theme and software packages).
    LimitRequestBody 67108864

    ErrorLog ${APACHE_LOG_DIR}/smart-license-server-error.log
    CustomLog ${APACHE_LOG_DIR}/smart-license-server-access.log combined
</VirtualHost>